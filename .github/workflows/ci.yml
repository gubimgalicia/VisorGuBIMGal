name: CI

on:
  pull_request:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cargo check
        run: cargo check --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build wasm-api
        run: cargo build -p wasm-api --release --target wasm32-unknown-unknown

  licences:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo deny check
        run: cargo deny check

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build kernel bindings
        run: npm run kernel

      - name: Check the kernel binary
        run: node --experimental-strip-types scripts/check-kernel.mjs

      - name: Check out-of-memory handling
        run: node --experimental-strip-types scripts/check-oom.mjs

      - name: Check drawing requests
        run: node --experimental-strip-types scripts/check-drawing-request.mjs

      - name: Check 2D drawings
        run: node --experimental-strip-types scripts/check-drawings.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Vite build
        run: npx vite build

  # Backlog D1: TC-001..008 and the feature checks in headless Chrome (test/e2e/README.md).
  # The runner has no GPU: WebGL2, WebGPU without an adapter and WebGPU all run on SwiftShader
  # as required steps; the hardware GPU matrix runs locally.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_OUT: /tmp/gubim-e2e
      E2E_REQUIRE_REFS: '1'
      E2E_CHROME_FLAGS: --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader --enable-features=Vulkan --use-vulkan=swiftshader --use-webgpu-adapter=swiftshader
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build kernel bindings
        run: npm run kernel

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests, WebGL2 and WebGPU without an adapter
        run: npm run test:e2e
        env:
          E2E_MODES: gl2,none

      - name: Browser tests, WebGPU on SwiftShader
        run: npm run test:e2e
        env:
          E2E_MODES: gpu

      - name: Upload screenshots and new references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: |
            /tmp/gubim-e2e/*.png
            /tmp/gubim-e2e/*.json
            /tmp/gubim-e2e/new-refs/
          if-no-files-found: ignore

  # Backlog D2: kernel benchmark against the base of the change (scripts/bench/bench.mjs).
  # Both kernels are built here and run alternately on the same runner, so only the relative
  # change counts. Fails on a confirmed slowdown of more than 15 % and 100 ms on any workload.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build kernel bindings
        run: npm run kernel

      # Real buildingSMART community models (CC BY 4.0), pinned by sha256 in scripts/models.json.
      - name: Cache real models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/models/bench
          key: bench-models-${{ hashFiles('scripts/models.json') }}

      - name: Fetch real models
        run: node scripts/fetch-models.mjs --bench

      - name: Benchmark against the base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit (new branch): measuring this commit alone."
            node scripts/bench/bench.mjs --runs 3 --summary "$GITHUB_STEP_SUMMARY"
          else
            node scripts/bench/bench.mjs --base-ref "$BASE_SHA" --runs 5 --threshold 0.15 --min-ms 100 --summary "$GITHUB_STEP_SUMMARY"
          fi

  ban:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check banned IFClite occurrences
        run: |
          count=$( (grep -rniE "ifc-lite|ifclite" src index.html vite.config.ts package.json package-lock.json 2>/dev/null || true) | wc -l )
          if [ "$count" -ne 0 ]; then
            echo "Found $count banned IFClite occurrences:"
            grep -rniE "ifc-lite|ifclite" src index.html vite.config.ts package.json package-lock.json
            exit 1
          fi
          test "$count" -eq 0
